<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Galeria das memórias do aniversário de Inaude." />
    <title>Galeria | Parabéns, Inaude</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div class="site-frame">
      <header class="site-header">
        <a class="wordmark" href="/" aria-label="Voltar para a página inicial">
          <span class="wordmark__number">60</span>
          <span class="wordmark__name">Inaude Jr.</span>
        </a>
        <a class="header-link" href="/upload.html">Subir momento <span aria-hidden="true">↗</span></a>
      </header>

      <main>
        <section class="gallery-shell">
          <div class="eyebrow" style="justify-content:center; margin-bottom:1rem;">
            <span class="eyebrow__line"></span> Álbum virtual <span class="eyebrow__line"></span>
          </div>

          <div class="gallery-toolbar">
            <div>
              <h1 class="gallery-title">O álbum que criamos juntos</h1>
              <p class="gallery-description" data-gallery-status role="status" aria-live="polite">Carregando as lembranças compartilhadas…</p>
            </div>
            <div class="gallery-filters" aria-label="Filtros da galeria">
              <button type="button" class="gallery-filter is-active" data-gallery-filter="all">Todos</button>
              <button type="button" class="gallery-filter" data-gallery-filter="photo">Fotos</button>
              <button type="button" class="gallery-filter" data-gallery-filter="video">Vídeos</button>
            </div>
          </div>

          <div class="gallery-grid" data-gallery-grid></div>
          <a class="button button--gold gallery-upload-link" href="/upload.html">Compartilhar minhas fotos e vídeos <span aria-hidden="true">↗</span></a>
        </section>
      </main>

    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
